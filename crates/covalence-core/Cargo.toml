[package]
name = "covalence-core"
description = "Covalence IO engine: state tree, journal, output gate, host supervision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
covalence-protocol.workspace = true
covalence-store.workspace = true
rmpv = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tracing = "0.1.44"
ulid = "3.0.0"

# A protocol-speaking stand-in for the Deno host, for the supervisor tests.
[[bin]]
name = "covalence-fake-host"
path = "testing/fake_host.rs"
test = false
doc = false

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
