[package]
name = "covalence-core"
description = "Covalence IO engine: state tree, journal, output gate, host supervision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
covalence-protocol.workspace = true
covalence-store.workspace = true
png = "0.18"
rmpv = "1.3.1"
rquickjs = { version = "0.14.0", features = ["parallel"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
tiny-skia = "0.12"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tracing = "0.1.44"
ulid = "3.0.0"

# A protocol-speaking stand-in for the Deno host, for the supervisor tests.
[[bin]]
name = "covalence-fake-host"
path = "testing/fake_host.rs"
test = false
doc = false

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tiny-skia = "0.12"
tokio = { version = "1.53.3", features = ["test-util", "macros", "rt-multi-thread"] }
