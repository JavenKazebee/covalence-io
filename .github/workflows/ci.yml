name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The server's end-to-end tests run the real Deno plugin host.
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
      - run: deno fmt --check
      - run: deno lint
      - run: deno check packages/ plugins/
      - run: deno task test

  protocol-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate JSON Schema and TS types
        run: pnpm --filter @covalence-io/protocol-schema build
      - name: Fail if generated files are stale
        run: |
          git status --porcelain protocol/json-schema packages/protocol/types.gen.ts
          test -z "$(git status --porcelain protocol/json-schema packages/protocol/types.gen.ts)"

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ui type-check
      - run: pnpm --filter ui lint
      - run: pnpm --filter ui test
      - run: pnpm --filter ui build
